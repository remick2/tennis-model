name: live-auth-check
# Manual, ~1 minute, NO ORDERS: logs in to Kalshi and Polymarket US with Remick's keys, reads both balances, and
# previews (never places) Polymarket US orders to prove how short orders are priced. Writes data/live/auth_check.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: auth check (no orders)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          POLY_KEY_ID: ${{ secrets.POLY_KEY_ID }}
          POLY_SECRET_KEY: ${{ secrets.POLY_SECRET_KEY || secrets.POLY_PRIVATE_KEY }}
        run: |
          cd src && python -W ignore - <<'PY'
          import os, bot, live
          print("secrets present:", {k: bool(os.environ.get(k)) for k in ["KALSHI_KEY_ID", "KALSHI_PRIVATE_KEY", "POLY_KEY_ID", "POLY_SECRET_KEY"]})
          LV = live.Live.from_env()
          if not LV:
              raise SystemExit("keys missing or unusable")
          live.auth_check(LV, bot.universe())
          PY
      - name: save result
        if: always()
        run: |
          git config user.name "tennis-bot-dryrun"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/auth_check.json 2>/dev/null && git commit -qm "live auth check (no orders)" && \
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 10; done || true
