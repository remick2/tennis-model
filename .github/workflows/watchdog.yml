name: snapshot-watchdog
# Restarts the tennis tracker, the consensus tracker, the arb scanner and the dry-run bot if any isn't running (e.g. a GitHub outage
# broke an hourly loop's handoff). Cron is unreliable, so this fires every 20 min to get several
# chances an hour. Public repo: no cost.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: restart trackers if no run is active or queued
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          rc=0
          for wf in snapshot.yml consensus.yml arbscan.yml bot.yml; do
            active=0
            for s in in_progress queued pending waiting requested; do
              n=$(gh run list -R "$R" --workflow "$wf" --status "$s" --json databaseId --jq length 2>/dev/null || echo 0)
              active=$(( active + n ))
            done
            echo "$wf: active or queued runs: $active"
            [ "$active" -gt 0 ] && continue
            args=""; [ "$wf" = snapshot.yml ] && args="-f pinnacle=auto"
            ok=0
            for i in 1 2 3 4; do
              gh workflow run "$wf" -R "$R" --ref main $args && echo "restarted $wf" && ok=1 && break
              sleep $(( i * 20 ))
            done
            [ "$ok" -eq 0 ] && echo "restart of $wf failed (GitHub API down?) - next watchdog run will retry" && rc=1
          done
          exit $rc
