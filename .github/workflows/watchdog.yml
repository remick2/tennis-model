name: snapshot-watchdog
# Restarts the tennis tracker if it's not running (e.g. a GitHub outage broke the hourly loop's handoff).
# Cron is unreliable, so this fires every 20 min to get several chances an hour. Public repo: no cost.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: restart tracker if no run is active or queued
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          active=0
          for s in in_progress queued pending waiting requested; do
            n=$(gh run list -R "$R" --workflow snapshot.yml --status "$s" --json databaseId --jq length 2>/dev/null || echo 0)
            active=$(( active + n ))
          done
          echo "active or queued snapshot runs: $active"
          if [ "$active" -eq 0 ]; then
            for i in 1 2 3 4; do
              gh workflow run snapshot.yml -R "$R" --ref main -f pinnacle=auto && echo "restarted tracker" && exit 0
              sleep $(( i * 20 ))
            done
            echo "restart failed (GitHub API down?) - next watchdog run will retry"; exit 1
          fi
