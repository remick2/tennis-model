name: arb-scanner
# PAPER ONLY. Scans Kalshi + Polymarket US every minute (pre-match and live) for cross-venue arbs.
# Each run lasts ~5h40m and requests its successor an hour before it ends; cron + watchdog are backups.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: arbscan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: scan every minute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tennis-arbscan-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin main && git checkout -q -B main origin/main   # latest code, not the commit from when this run was requested
          cd src && python -W ignore arbscan.py --minutes 340
