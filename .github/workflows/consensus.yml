name: consensus-tracker
# Polymarket copy-consensus PAPER TRACKING (consensus/). Separate from the tennis snapshot.
# Public repo: each run checks hourly at :40 for ~5h40m, then starts the next run itself
# (consensus/loop.sh), because GitHub's cron drops many scheduled runs. The hourly cron below is
# only a backup starter. Private repo: one check per run.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write   # lets a run start the next one
concurrency:
  group: consensus
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: track (hourly loop + self-restart if public; one check if private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "consensus-bot"
          git config user.email "actions@users.noreply.github.com"
          bash consensus/loop.sh
