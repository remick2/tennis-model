name: consensus-audit
# Manual only: read-only audit of the consensus tracker (out-of-sample check of the Nov 3 leaderboard cohort).
# Prints compressed data to the job log; changes nothing in the repo.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python consensus/audit.py
