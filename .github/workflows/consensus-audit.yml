name: consensus-audit
# Read-only weekly audit of the consensus idea (consensus/audit.py): rebuilds every signal from the traders'
# full trade history for a fixed panel and opens a "Consensus weekly audit" issue. Fridays (two crons because
# GitHub drops scheduled runs; the second is skipped if this week's issue exists) and on demand.
on:
  schedule:
    - cron: "10 13 * * 5"
    - cron: "10 19 * * 5"
  workflow_dispatch:
    inputs:
      dump:
        description: "Also print raw aggregates to the log (true/false)"
        default: "false"
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            recent=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "Consensus weekly audit in:title created:>=$(date -u -d '-5 days' +%Y-%m-%d)" --json number --jq length)
            [ "$recent" -gt 0 ] && echo "this week's audit already exists" && exit 0
          fi
          python consensus/audit.py $([ "${{ inputs.dump }}" = "true" ] && echo --dump)
          title=$(head -n 1 consensus/audit.md)
          tail -n +2 consensus/audit.md > body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
