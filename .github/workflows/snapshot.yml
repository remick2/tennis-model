name: phase2-snapshot
# PAPER TRACKING ONLY. Each cycle: Kalshi results, Kalshi + Polymarket + Pinnacle (budgeted) + model
# snapshot, alerts, scorecard (scripts/cycle.sh).
# Private repo: one cycle per run (free minutes are limited).
# Public repo: each run loops hourly for ~5h40m and then starts the next run itself (scripts/loop.sh),
# because GitHub's cron drops many scheduled runs. The hourly cron below is only a backup starter.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pinnacle:
        description: "Pull Pinnacle this run? (auto/1/0)"
        default: "auto"
permissions:
  contents: write
  issues: write
  actions: write   # lets a run start the next one
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/raw/atp
          key: sackmann-atp-${{ hashFiles('scripts/sackmann_files.txt') }}
      - uses: actions/cache@v4
        with:
          path: data/raw/wta
          key: sackmann-wta-${{ hashFiles('scripts/sackmann_files.txt') }}
      - id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4  # ratings rebuilt at most once a day
        with:
          path: data/ratings.pkl
          key: ratings-${{ steps.day.outputs.d }}-${{ hashFiles('src/*.py', 'scripts/sackmann_files.txt') }}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_data.sh
      - name: track (one cycle if private; hourly loop + self-restart if public)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PINNACLE: ${{ github.event.inputs.pinnacle || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tennis-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/loop.sh
